site_name: API Security — Authentication & Authorization
site_description: A language-agnostic field guide to API authentication schemes and authorization patterns
docs_dir: docs
site_url: https://nitinkc.github.io/api-security/
repo_url: https://github.com/nitinkc/api-security

theme:
  name: material
  icon:
    logo: material/shield-key
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.view

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
  - mkdocs_quiz:
      show_progress: true
      auto_submit: true
      shuffle_answers: true
      auto_number: true

extra:
  generator: false

nav:
  - Home:
      - Home: index.md
      - Comparison & Selection: comparison.md
      - Security Best Practices: best-practices.md
      - Standards & References: references.md
  - Authentication:
      - authentication/index.md
      - Basic Auth: authentication/basic-auth.md
      - Token Auth: authentication/token-auth.md
      - JWT: authentication/jwt.md
      - OAuth 2.0: authentication/oauth.md
      - Session Auth: authentication/session-auth.md
      - MFA: authentication/mfa.md
      - Enterprise SSO: authentication/enterprise-sso.md
      - Passkeys & WebAuthn: authentication/passkeys.md
      - Mutual TLS: authentication/mtls.md
      - Request Signing: authentication/request-signing.md
  - Authorization:
      - authorization/index.md
      - Access-Control Models: authorization/models.md
      - Scopes & Claims: authorization/scopes-claims.md
      - Object & Function Level: authorization/object-level.md
      - Policy Engines & Enforcement: authorization/policy-engines.md
      - Multi-Tenancy & Delegation: authorization/multi-tenancy.md
      - Testing & Pitfalls: authorization/testing.md
      - "Worked Example: RBAC API": authorization/rbac-design.md
  - Knowledge Check:
      - quiz/index.md
      - Authentication:
          - Basic Auth: quiz/basic-auth.md
          - Token Auth & API Keys: quiz/token-auth.md
          - JWT: quiz/jwt.md
          - OAuth 2.0: quiz/oauth.md
          - Session Auth: quiz/session-auth.md
          - MFA: quiz/mfa.md
          - Enterprise SSO: quiz/enterprise-sso.md
          - Passkeys & WebAuthn: quiz/passkeys.md
          - Mutual TLS: quiz/mtls.md
          - Request Signing: quiz/request-signing.md
      - Authorization:
          - Access-Control Models: quiz/models.md
          - Scopes & Claims: quiz/scopes-claims.md
          - Object & Function Level: quiz/object-level.md
          - Policy Engines & Enforcement: quiz/policy-engines.md
          - Multi-Tenancy & Delegation: quiz/multi-tenancy.md
          - Testing & Pitfalls: quiz/testing.md
          - "Worked Example: RBAC API": quiz/rbac-design.md
      - Cross-cutting: quiz/cross-cutting.md
  - Glossary: glossary.md
